<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;padding:0}
  .tile{width:1280px;height:854px;display:flex;overflow:hidden;font-family:var(--font-sans,'proxima-nova',sans-serif)}
  .main{flex:1;background:#003767;display:flex;align-items:center;justify-content:center;padding:0 90px}
  .main img{width:100%;max-width:760px;height:auto}
  .strip{width:150px;display:flex;flex-direction:column}
  .strip span{flex:1;display:block}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><img src="assets/brand/patterson-logo-white.svg" alt="Patterson"></div>
  <div class="strip">
    <span style="background:#7BC24D"></span>
    <span style="background:#00A8E1"></span>
    <span style="background:#00817D"></span>
    <span style="background:#522E91"></span>
  </div>
</div>
</body>
</html>
